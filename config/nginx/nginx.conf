worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # ── Security headers ──────────────────────────────────────────────────────
    server_tokens off;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;

    # ── Upstream: axio-validator diagnostics server ───────────────────────────
    upstream axio_validator {
        server axio-validator:9100;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        # ── /health — public: for external load balancers / uptime monitors ──
        location /health {
            proxy_pass         http://axio_validator/health;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 5s;
            # Cache-Control: không cache health status
            add_header Cache-Control "no-store, no-cache";
        }

        # ── /metrics — restricted: ONLY internal Docker network (Prometheus) ─
        # Prometheus container (axio-prometheus) đi qua Docker bridge network.
        # Từ chối mọi request từ ngoài subnet 172.0.0.0/8 (Docker default range).
        location /metrics {
            # Cho phép Docker internal network
            allow  172.0.0.0/8;
            allow  10.0.0.0/8;
            allow  127.0.0.1;
            # Chặn tất cả IP khác — 403 Forbidden
            deny   all;

            proxy_pass         http://axio_validator/metrics;
            proxy_set_header   Host $host;
            proxy_read_timeout 10s;
            add_header Cache-Control "no-store";
        }

        # ── / — redirect về /health cho convenience ───────────────────────────
        location / {
            return 302 /health;
        }
    }
}
