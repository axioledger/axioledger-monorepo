name: CI — Test, Typecheck & Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
    PNPM_VERSION: "9"
  NODE_VERSION: "22"

jobs:
  test:
    name: Test & Typecheck (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
      fail-fast: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Typecheck (all packages)
        run: pnpm --recursive --filter "./packages/**" run typecheck --if-present

      - name: Lint (all packages)
        run: pnpm --recursive --filter "./packages/**" run lint --if-present

      - name: Build (all packages)
        run: pnpm --recursive --filter "./packages/**" run build --if-present
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Test (all packages)
        run: pnpm --recursive --filter "./packages/**" run test --if-present

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
