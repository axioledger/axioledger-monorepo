name: CI — Axioledger Monorepo
# Security note: the "rust-release-guard" job enforces that the
# `testnet-stub` Cargo feature is NEVER compiled into a release build.
# Any PR that accidentally enables it on main/release branches will be blocked.

on:
  push:
    branches: [main, develop, "release/**"]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # NPM publish token — set trong GitHub → Settings → Secrets → Actions
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
  PNPM_VERSION: "9"
  NODE_VERSION: "22"

jobs:
  # ──────────────────────────────────────────────────────────────
  # JOB 0: Rust Release Guard — chặn testnet-stub vào release build
  #
  # Mục đích: Đảm bảo `testnet-stub` Cargo feature không bao giờ
  # được compile vào bản build production/release. Nếu job này fail,
  # toàn bộ CI pipeline bị block ngay lập tức.
  #
  # Kiểm tra 2 tầng:
  #   1. Cargo.toml không expose `testnet-stub` là default feature
  #   2. `cargo build --release` không kích hoạt feature này
  # ──────────────────────────────────────────────────────────────
  rust-release-guard:
    name: "🔒 Rust Release Guard — No testnet-stub"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/axioledger/contracts/escrow/target
          key: rust-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: "Guard 1 — testnet-stub must NOT be in [features.default]"
        working-directory: packages/axioledger/contracts/escrow
        run: |
          if grep -E '^\s*default\s*=.*testnet-stub' Cargo.toml; then
            echo "::error file=packages/axioledger/contracts/escrow/Cargo.toml::SECURITY VIOLATION: 'testnet-stub' is listed as a default Cargo feature. Remove it immediately."
            exit 1
          fi
          echo "✅ Guard 1 passed: testnet-stub is not a default feature."

      - name: "Guard 2 — cargo build --release must not activate testnet-stub"
        working-directory: packages/axioledger/contracts/escrow
        run: |
          # Build release binary and capture the enabled feature list.
          # --no-default-features ensures we only check what is truly default.
          cargo build --release 2>&1 | tee /tmp/cargo_release.log || true

          # Confirm testnet-stub path is NOT in the compiled output metadata.
          if cargo build --release --message-format=json 2>/dev/null \
              | jq -r 'select(.reason=="compiler-artifact") | .features[]?' \
              | grep -q "testnet-stub"; then
            echo "::error::SECURITY VIOLATION: 'testnet-stub' feature was activated in --release build."
            exit 1
          fi
          echo "✅ Guard 2 passed: testnet-stub is absent from release build."

      - name: "Guard 3 — cargo check (default features) must compile without testnet-stub code path"
        working-directory: packages/axioledger/contracts/escrow
        run: |
          # Verify the #[cfg(feature = "testnet-stub")] branch is unreachable in default build
          cargo check --release 2>&1
          echo "✅ Guard 3 passed: clean cargo check --release."

  # ──────────────────────────────────────────────────────────────
  # JOB 1: Install & Build
  # ──────────────────────────────────────────────────────────────
  install:
    name: Install & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init required submodules only
        run: |
          git submodule update --init --recursive packages/core/ethereum-lists/chains
          git submodule update --init --recursive packages/core/ethereum-lists/tokens

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          # Xác thực với registry.npmjs.org bằng NPM_TOKEN
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build all packages
        run: pnpm --recursive --filter "./packages/**" run build --if-present
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Cache node_modules để các jobs sau dùng lại
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            packages/**/node_modules
            toolchain/**/node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

  # ──────────────────────────────────────────────────────────────
  # JOB 2: TypeScript typecheck
  # ──────────────────────────────────────────────────────────────
  typecheck:
    name: TypeScript Typecheck
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: https://registry.npmjs.org/
      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            packages/**/node_modules
            toolchain/**/node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
      - name: Install (if cache miss)
        run: pnpm install --no-frozen-lockfile
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Typecheck all packages
        run: pnpm --recursive --filter "./packages/**" run typecheck --if-present

  # ──────────────────────────────────────────────────────────────
  # JOB 3: Unit Tests
  # ──────────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: https://registry.npmjs.org/
      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            packages/**/node_modules
            toolchain/**/node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
      - name: Install (if cache miss)
        run: pnpm install --no-frozen-lockfile
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Run all tests
        run: pnpm --recursive --filter "./packages/**" run test --if-present

  # ──────────────────────────────────────────────────────────────
  # JOB 4: Doc Link Check
  # ──────────────────────────────────────────────────────────────
  doc-links:
    name: Documentation Link Check
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Check doc links
        run: node scripts/check-doc-links.js
        # Không dùng --strict để CI không fail vì anchor slugs
        # Đổi thành --strict khi docs đã chuẩn hóa hoàn toàn

  # ──────────────────────────────────────────────────────────────
  # JOB 5: Publish (chỉ chạy khi push lên main + có tag v*)
  # ──────────────────────────────────────────────────────────────
  publish:
    name: Publish to NPM
    runs-on: ubuntu-latest
    # rust-release-guard is a hard prerequisite for publish — no release
    # goes out if the Rust security gate has not passed.
    needs: [typecheck, test, rust-release-guard]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: https://registry.npmjs.org/
      - name: Install
        run: pnpm install --no-frozen-lockfile
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Build
        run: pnpm --recursive --filter "./packages/**" run build --if-present
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish packages
        run: pnpm --recursive --filter "./packages/**" publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
